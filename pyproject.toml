[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precog"
version = "0.1.0"
description = "Precog — authorized OSINT/recon defensive agent (fatia-1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
precog = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "osint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
